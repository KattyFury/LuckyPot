name: Keeper bot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore commit-reveal state
        uses: actions/cache/restore@v4
        with:
          path: automation/state
          key: keeper-state-${{ github.run_id }}
          restore-keys: keeper-state-

      - run: npm install

      - name: Fund weekly yield
        run: npm run fund-yield
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          POOL_ADDRESS: ${{ secrets.POOL_ADDRESS }}

      - name: Commit or reveal the weekly draw
        run: npm run draw
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          POOL_ADDRESS: ${{ secrets.POOL_ADDRESS }}

      # Keeps luckypot-history (D1) caught up so the frontend's My History
      # reads a database instead of paging through eth_getLogs itself - see
      # automation/src/indexHistory.ts for why that moved off the client.
      - name: Index deposit/withdraw/claim history
        run: npm run index-history
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          POOL_ADDRESS: ${{ secrets.POOL_ADDRESS }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Save commit-reveal state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: automation/state
          key: keeper-state-${{ github.run_id }}
