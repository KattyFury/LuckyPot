name: Keeper bot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore commit-reveal state
        uses: actions/cache/restore@v4
        with:
          path: automation/state
          key: keeper-state-${{ github.run_id }}
          restore-keys: keeper-state-

      - run: npm install

      - name: Fund weekly yield
        run: npm run fund-yield
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          POOL_ADDRESS: ${{ secrets.POOL_ADDRESS }}

      - name: Commit or reveal the weekly draw
        run: npm run draw
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          POOL_ADDRESS: ${{ secrets.POOL_ADDRESS }}

      - name: Save commit-reveal state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: automation/state
          key: keeper-state-${{ github.run_id }}
